# Drop into the Mattermost compose stack on Coolify, replacing the `echo` service.
# Coolify builds this from the Git repo's Dockerfile (no registry image needed).
services:
  mmbridge:
    build:
      context: https://github.com/rowama/mmbridge.git#main
      dockerfile: Dockerfile
    # Alternative if you later push an image to a registry:
    # image: ghcr.io/rowama/mmbridge:latest
    restart: unless-stopped
    environment:
      # Trusted proxy for X-Forwarded-For (Traefik IP/subnet on rmlab). TODO: real value from Rob; never '*'.
      # - FORWARDED_ALLOW_IPS=<traefik-ip-or-cidr>
      - SERVICE_FQDN_MMBRIDGE_8080=https://chats.rmlab.cloud   # Coolify domain -> container port 8080
      - MATTERMOST_URL=http://mattermost:8065                  # private network, used later
      # Wake URL http://relay:8080/wake/<bot> is accepted without any flag (http allowed only to host 'relay').
      # Never set LIVE_ALLOW_HTTP_WAKE here: it is tests-only.
      # Per-bot Mattermost tokens: add later as Coolify secrets, never commit them.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Same compose stack => same default network as `mattermost`, so
    # http://mattermost:8065 resolves without exposing Mattermost publicly.

  # Wake relay (ADR-0011, relay/README.md): service in THIS compose stack (Rob 2026-10-30), not a separate
  # Coolify app. Holds the Grok routine keys. mmbridge wakes it at http://relay:8080/wake/<bot> (private net).
  relay:
    build:
      context: https://github.com/rowama/mmbridge.git#main:relay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Optional public domain for ops only (mmbridge does not need it):
      # - SERVICE_FQDN_RELAY_8080=https://relay.rmlab.cloud
      # Per bot, as Coolify secrets (never commit values): <NAME> = bot name upper-case, '-' -> '_'
      # - RELAY_BOT_EDDIE_HMAC_SECRET=<eddie's mmbridge wake secret>
      # - RELAY_BOT_EDDIE_ROUTINE_URL=<Grok Bot routine webhook URL>
      # - RELAY_BOT_EDDIE_ROUTINE_KEY=<routine Bearer key>
      # Optional tripwire alert to a Mattermost channel (all three or none; relay/README.md "Tripwire"):
      # - RELAY_ALERT_URL=http://mattermost:8065
      # - RELAY_ALERT_TOKEN=<dedicated alert bot token>
      # - RELAY_ALERT_CHANNEL=<alert channel id>
    volumes:
      - relay-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  relay-data:
